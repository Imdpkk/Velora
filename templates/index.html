<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velora Style 14 AI Assistant</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f12; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-card { width: 100%; max-width: 450px; height: 90vh; background: #18181c; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2a2a32; }
    .chat-header { padding: 20px; background: #22222a; text-align: center; font-weight: bold; font-size: 1.2rem; letter-spacing: 1px; border-bottom: 1px solid #2a2a32; }
    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.4; font-size: 0.95rem; }
    .bot { background: #2a2a35; align-self: flex-start; color: #e1e1e6; }
    .user { background: #d946ef; align-self: flex-end; color: #fff; }
    .chat-input { display: flex; padding: 15px; background: #22222a; border-top: 1px solid #2a2a32; gap: 10px; }
    input { flex: 1; background: #18181c; border: 1px solid #3f3f4e; color: #fff; padding: 12px; border-radius: 8px; outline: none; }
    button { background: #d946ef; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button:hover { background: #c026d3; }
  </style>
</head>
<body>
  <div class="chat-card">
    <div class="chat-header">VELORA STYLE 14 AI</div>
    <div class="chat-box" id="box">
      <div class="msg bot">Hey gorgeous! ✨ Welcome to Velora Style 14. How can I assist your wardrobe today? 🛍️</div>
    </div>
    <div class="chat-input">
      <input type="text" id="msg" placeholder="Ask about styles, delivery, or sizes..." onkeydown="if(event.key==='Enter') send()" />
      <button onclick="send()">Send</button>
    </div>
  </div>
  <script>
    async function send() {
      const input = document.getElementById('msg');
      const box = document.getElementById('box');
      const text = input.value.trim();
      if(!text) return;
      box.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      box.scrollTop = box.scrollHeight;
      try {
        const res = await fetch('/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({message: text}) });
        const data = await res.json();
        box.innerHTML += `<div class="msg bot">${data.response}</div>`;
      } catch(e) {
        box.innerHTML += `<div class="msg bot">Something went wrong. Please try again!</div>`;
      }
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
